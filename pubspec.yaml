name: giracle
description: "Giracle chat client (Flutter)"
publish_to: 'none'
version: 0.1.0-alpha.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  web_socket_channel: ^3.0.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emoji_shortcodes.json
